ems-center gap-space-xs"><button class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-primary shadow-xs"><span class="material-symbols-outlined text-[18px]">spa</span></div><h1 class="font-headline-sm text-headline-sm text-on-surface ml-1 truncate max-w-[150px]">Live Voice Call</h1></div><div class="flex items-center gap-space-xs"><div class="flex items-center gap-1 px-2.5 py-1 bg-secondary-container/40 rounded-full"><span class="material-symbols-outlined text-secondary text-[18px]">graphic_eq</span><span class="font-label-sm text-label-sm text-on-secondary-container font-medium">Call</span></div><div class="min-h-[44px] min-w-[44px] flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9mUKuSlV1NIlyQNYuMJvrg41qRdxY_oWEgUDCBJokc5_YVmWwuDJcnUUuFSy3S_cjqJdKH0Q18Cjuf-7Cc030WTc2AhIfdPgBIG9eZuxjq-fL4T7_WLhoWUaPzUq6QQh6S-wX_26mvy3fB9KbhuMfXx_ikzZ8FKIyzqwzC-9aLvTEp8S6GV4c-lEJbasb_lfsEn5KAoN4uCLy5y88aWbwVoVq-duFtDETA4uPk7k"></div></div></div></header><main class="flex flex-col relative w-full pt-16 px-margin bg-surface min-h-screen pb-safe"><div class="flex flex-col flex-1 w-full justify-between items-center py-3 select-none min-h-[calc(100vh-5rem)]"><div class="relative flex flex-col items-center justify-center my-auto py-6 w-full flex-1"><div class="absolute w-72 h-72 sm:w-80 sm:h-80 rounded-full bg-primary-container/20 blur-2xl animate-pulse pointer-events-none"></div><div class="absolute w-60 h-60 rounded-full bg-secondary-container/25 blur-xl pointer-events-none"></div><div class="absolute w-72 h-72 rounded-full border border-primary/20 pointer-events-none animate-ping" style="animation-duration: 4s;"></div><div class="absolute w-60 h-60 rounded-full border border-secondary/20 pointer-events-none animate-pulse" style="animation-duration: 3s;"></div><div class="absolute inset-0 pointer-events-none flex items-center justify-center"><div class="absolute w-2 h-2 rounded-full bg-secondary-fixed-dim -translate-x-28 -translate-y-20 opacity-70 animate-pulse"></div><div class="absolute w-2.5 h-2.5 rounded-full bg-primary translate-x-28 -translate-y-24 opacity-50"></div><div class="absolute w-2.5 h-2.5 rounded-full bg-secondary-container translate-x-32 translate-y-16 opacity-60"></div><div class="absolute w-2 h-2 rounded-full bg-primary-container -translate-x-28 translate-y-20 opacity-70"></div></div><div class="relative z-10 w-56 h-56 sm:w-60 sm:h-60 rounded-full cursor-pointer transition-transform duration-500 ease-out flex items-center justify-center shadow-xl active:scale-95 animate-pulse" id="orb-body" style="background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e2daf8 45%, #c8ea89 75%, #9f8bd4 100%); box-shadow: rgba(101, 84, 151, 0.28) 0px 24px 50px -10px, rgba(75, 103, 0, 0.18) 0px -12px 28px inset, rgba(255, 255, 255, 0.95) 0px 12px 24px inset; animation-duration: 4s;"><div class="absolute top-5 left-10 w-20 h-10 rounded-full bg-white/80 blur-[3px] rotate-[-25deg] pointer-events-none"></div><div class="absolute bottom-6 right-8 w-16 h-8 rounded-full bg-secondary-fixed/50 blur-[4px] pointer-events-none"></div><div class="relative z-20 flex flex-col items-center justify-center transition-all duration-300 transform -translate-y-1" id="face-container"><div class="flex items-center gap-9 mb-1.5"><div class="relative w-5 h-6 bg-on-surface rounded-full flex items-start justify-start p-1 overflow-hidden transition-all duration-200" id="eye-left"><span class="w-2 h-2 rounded-full bg-white shadow-xs"></span><span class="absolute bottom-1 right-1 w-1 h-1 rounded-full bg-white/80"></span></div><div class="relative w-5 h-6 bg-on-surface rounded-full flex items-start justify-start p-1 overflow-hidden transition-all duration-200" id="eye-right"><span class="w-2 h-2 rounded-full bg-white shadow-xs"></span><span class="absolute bottom-1 right-1 w-1 h-1 rounded-full bg-white/80"></span></div></div><div class="w-6 h-3 rounded-b-full border-b-[3px] border-on-surface transition-all duration-300 mt-0.5" id="mouth"></div></div></div><div class="mt-8 flex flex-col items-center gap-3 z-10"><div class="flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-secondary-container/30 border border-secondary/20 backdrop-blur-md shadow-xs"><span class="w-2 h-2 rounded-full bg-secondary animate-ping"></span><span class="font-label-sm text-label-sm text-on-secondary-container font-semibold tracking-wide" id="status-label">Saathi is speaking...</span></div><div class="flex items-center justify-center gap-1.5 px-4 py-2 bg-surface-container-lowest/90 rounded-full border border-outline-variant/30 shadow-xs h-9"><div class="waveform-bar w-1 bg-primary rounded-full transition-all duration-150" style="height: 12px;"></div><div class="waveform-bar w-1 bg-secondary rounded-full transition-all duration-150" style="height: 20px;"></div><div class="waveform-bar w-1 bg-primary-container rounded-full transition-all duration-150" style="height: 14px;"></div><div class="waveform-bar w-1 bg-secondary-fixed rounded-full transition-all duration-150" style="height: 24px;"></div><div class="waveform-bar w-1 bg-primary rounded-full transition-all duration-150" style="height: 8px;"></div><div class="waveform-bar w-1 bg-secondary-fixed-dim rounded-full transition-all duration-150" style="height: 18px;"></div><div class="waveform-bar w-1 bg-primary-container rounded-full transition-all duration-150" style="height: 10px;"></div><div class="waveform-bar w-1 bg-secondary rounded-full transition-all duration-150" style="height: 22px;"></div><div class="waveform-bar w-1 bg-outline-variant rounded-full transition-all duration-150" style="height: 6px;"></div></div></div></div><div class="w-full flex flex-col items-center gap-3 mt-auto pb-6 z-20"><div class="w-full bg-surface-container-lowest/95 backdrop-blur-xl px-6 py-3 rounded-full shadow-md border border-outline-variant/30 flex items-center justify-between max-w-xs"><button class="w-12 h-12 rounded-full bg-secondary-container/40 hover:bg-secondary-container/60 text-on-secondary-container flex items-center justify-center transition-all duration-200 active:scale-90 shadow-xs" id="btn-mic-toggle" onclick="toggleMute()" aria-label="Mute Microphone"><span class="material-symbols-outlined text-[22px]" id="mic-icon">mic</span></button><button class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface flex items-center justify-center transition-all duration-200 active:scale-90 shadow-xs" aria-label="Speakerphone"><span class="material-symbols-outlined text-[22px]">volume_up</span></button><button class="w-12 h-12 rounded-full bg-error-container hover:bg-error-container/80 text-on-error-container flex items-center justify-center transition-all duration-200 active:scale-90 shadow-xs" onclick="endVoiceSession()" aria-label="End Call"><span class="material-symbols-outlined text-[22px]">call_end</span></button></div></div></div>
<script>
  let isMuted = false;
  let currentState = 'speaking';

  // Orb Facial Elements
  const orb = document.getElementById('orb-body');
  const leftEye = document.getElementById('eye-left');
  const rightEye = document.getElementById('eye-right');
  const mouth = document.getElementById('mouth');
  const auraOuter = document.getElementById('aura-halo-outer');
  const statusDot = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const transcript = document.getElementById('live-transcript');

  // Random Natural Eye Blinking
  function triggerBlink() {
    leftEye.style.transform = 'scaleY(0.1)';
    rightEye.style.transform = 'scaleY(0.1)';
    setTimeout(() => {
      leftEye.style.transform = 'scaleY(1)';
      rightEye.style.transform = 'scaleY(1)';
    }, 180);
    const nextBlink = Math.random() * 3500 + 2000;
    setTimeout(triggerBlink, nextBlink);
  }
  setTimeout(triggerBlink, 2000);

  // Smooth Orb Interactive State Switcher
  function setOrbState(state) {
    currentState = state;

    // Reset State Pill Styling
    document.querySelectorAll('.state-pill').forEach(btn => {
      btn.className = 'state-pill px-3 py-1.5 rounded-full font-label-sm text-label-sm transition-all duration-300 text-on-surface-variant hover:text-on-surface flex items-center gap-1.5';
    });
    const activeBtn = document.getElementById('btn-' + state);
    if (activeBtn) {
      activeBtn.className = 'state-pill px-3 py-1.5 rounded-full font-label-sm text-label-sm transition-all duration-300 bg-surface-container-lowest text-on-surface shadow-xs flex items-center gap-1.5';
    }

    if (state === 'idle') {
      orb.style.transform = 'scale(0.96)';
      auraOuter.style.transform = 'scale(0.85)';
      auraOuter.style.opacity = '0.3';
      mouth.className = 'w-5 h-2 rounded-b-full border-b-[2px] border-on-surface transition-all duration-300 mt-1.5';
      statusDot.className = 'w-2 h-2 rounded-full bg-outline-variant';
      statusLabel.textContent = 'Saathi is resting silently';
      transcript.textContent = '"Main yahi hoon, jab mann kare mujhe pukaarein."';
    } 
    else if (state === 'listening') {
      orb.style.transform = 'scale(1.05)';
      auraOuter.style.transform = 'scale(1.25)';
      auraOuter.style.opacity = '0.8';
      mouth.className = 'w-4 h-2 rounded-full bg-on-surface transition-all duration-300 mt-1';
      statusDot.className = 'w-2 h-2 rounded-full bg-secondary animate-ping';
      statusLabel.textContent = 'Listening attentively...';
      transcript.textContent = '"Aapki baat sun rahi hoon, Priya... boliye."';
    } 
    else if (state === 'thinking') {
      orb.style.transform = 'scale(1.0) rotate(5deg)';
      auraOuter.style.transform = 'scale(1.1)';
      auraOuter.style.opacity = '0.6';
      mouth.className = 'w-4 h-1 rounded-full bg-on-surface transition-all duration-300 mt-2';
      statusDot.className = 'w-2 h-2 rounded-full bg-primary animate-pulse';
      statusLabel.textContent = 'Saathi is thinking...';
      transcript.textContent = '"Hmm... samajh rahi hoon. Ek pal dijiye..."';
    } 
    else if (state === 'speaking') {
      orb.style.transform = 'scale(1.08)';
      auraOuter.style.transform = 'scale(1.35)';
      auraOuter.style.opacity = '0.9';
      mouth.className = 'w-7 h-4 rounded-b-full border-b-[3.5px] border-on-surface transition-all duration-300 mt-1';
      statusDot.className = 'w-2 h-2 rounded-full bg-secondary-fixed-dim animate-bounce';
      statusLabel.textContent = 'Saathi is speaking';
      transcript.textContent = '"Namaste Priya! Main sun rahi hoon. Chaliye ek gehri saans lete hain... Aaj office mein kuch zyada stress tha kya?"';
    } 
    else if (state === 'interrupted') {
      orb.style.transform = 'scale(0.98) translateY(-4px)';
      auraOuter.style.transform = 'scale(0.95)';
      auraOuter.style.opacity = '0.4';
      mouth.className = 'w-4 h-3 rounded-full border-2 border-on-surface transition-all duration-300 mt-1';
      statusDot.className = 'w-2 h-2 rounded-full bg-error';
      statusLabel.textContent = 'Saathi paused (Interrupted)';
      transcript.textContent = '"Arey bilkul! Aap boliye, main ruk gayi."';
    }
  }

  // Eye movement tracking pointer position
  document.addEventListener('mousemove', (e) => {
    const rect = orb.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const deltaX = Math.max(-4, Math.min(4, (e.clientX - centerX) / 25));
    const deltaY = Math.max(-3, Math.min(3, (e.clientY - centerY) / 25));
    
    leftEye.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
    rightEye.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
  });

  // Toggle Mute Interaction
  function toggleMute() {
    isMuted = !isMuted;
    const micBtn = document.getElementById('btn-mic-toggle');
    const micIcon = document.getElementById('mic-icon');
    if (isMuted) {
      micBtn.className = 'w-12 h-12 rounded-full bg-error-container text-on-error-container flex items-center justify-center shadow-xs transition-transform active:scale-90';
      micIcon.textContent = 'mic_off';
      setOrbState('idle');
    } else {
      micBtn.className = 'w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-xs transition-transform active:scale-90';
      micIcon.textContent = 'mic';
      setOrbState('listening');
    }
  }

  // Quick Prompt Filler
  function insertQuickPrompt(text) {
    const promptBubble = document.createElement('div');
    promptBubble.className = 'flex items-start justify-end gap-2 animate-fade-in';
    promptBubble.innerHTML = `<div class="bg-primary-fixed/40 px-3.5 py-2 rounded-2xl rounded-tr-xs text-on-primary-container font-body-md text-body-md max-w-[85%]">"${text}"</div>`;
    transcript.parentElement.parentElement.insertBefore(promptBubble, transcript.parentElement);
    setOrbState('thinking');
    setTimeout(() => {
      setOrbState('speaking');
    }, 1200);
  }

  function toggleKeyboardChat() {
    const prompt = window.prompt("Type a message to Saathi:", "");
    if (prompt) {
      insertQuickPrompt(prompt);
    }
  }

  function endVoiceSession() {
    if (confirm("Disconnect live call with Saathi?")) {
      setOrbState('idle');
      statusLabel.textContent = 'Call Ended • Tap talk to rejoin';
    }
  }

  // Animated Waveform randomized heights
  setInterval(() => {
    if (currentState === 'speaking' || currentState === 'listening') {
      document.querySelectorAll('.waveform-bar').forEach(bar => {
        const h = Math.floor(Math.random() * 26) + 6;
        bar.style.height = h + 'px';
      });
    } else {
      document.querySelectorAll('.waveform-bar').forEach(bar => {
        bar.style.height = '4px';
      });
    }
  }, 160);
</script></main>
