<!-- Interactive Delight Micro-behaviors: Floating, Eye Tracking & Blinking -->
<script>
  (function initSaathiOrb() {
    const orb = document.getElementById('character-orb');
    const face = document.getElementById('orb-face');
    const shadow = document.getElementById('orb-shadow');
    const eyes = document.querySelectorAll('.eye');

    if (!orb || !face) return;

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    // Soft floating animation tick
    let floatAngle = 0;

    function animate() {
      floatAngle += 0.035;
      const floatY = Math.sin(floatAngle) * 5;
      
      // Interpolate face position toward cursor/touch target
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      face.style.transform = `translate(${currentX}px, ${currentY + floatY * 0.5}px)`;
      orb.style.transform = `translateY(${floatY}px)`;
      
      if (shadow) {
        const shadowScale = 1 - (floatY / 30);
        shadow.style.transform = `scale(${shadowScale})`;
        shadow.style.opacity = `${0.65 - (floatY * 0.02)}`;
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Subtle Eye Tracking on Pointer Move
    function handlePointer(e) {
      const rect = orb.getBoundingClientRect();
      const orbCenterX = rect.left + rect.width / 2;
      const orbCenterY = rect.top + rect.height / 2;

      const deltaX = (e.clientX - orbCenterX) / (window.innerWidth / 2);
      const deltaY = (e.clientY - orbCenterY) / (window.innerHeight / 2);

      // Clamp offset ranges
      targetX = Math.max(-10, Math.min(10, deltaX * 12));
      targetY = Math.max(-8, Math.min(8, deltaY * 10));
    }

    window.addEventListener('pointermove', handlePointer, { passive: true });

    // Playful spontaneous blinking
    function blink() {
      eyes.forEach(eye => {
        eye.style.transform = 'scaleY(0.12)';
      });
      setTimeout(() => {
        eyes.forEach(eye => {
          eye.style.transform = 'scaleY(1)';
        });
      }, 150);

      // Random next blink between 2.5s and 6.5s
      const nextBlink = Math.random() * 4000 + 2500;
      setTimeout(blink, nextBlink);
    }
    setTimeout(blink, 2000);

    // Click/Tap Delight: Happy Little Bounce and Wink
    orb.addEventListener('click', () => {
      orb.style.transform = 'scale(0.92)';
      eyes[1].style.transform = 'scaleY(0.15)'; // Wink right eye
      setTimeout(() => {
        orb.style.transform = 'scale(1.04)';
      }, 120);
      setTimeout(() => {
        orb.style.transform = 'scale(1)';
        eyes[1].style.transform = 'scaleY(1)';
      }, 260);
    });
  })();
